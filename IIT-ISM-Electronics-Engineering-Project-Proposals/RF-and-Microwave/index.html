<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Proposals</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* Grid layout for all projects */
        #projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .project-title {
            font-size: 1.25rem;
            color: #34495e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            line-height: 1.4;
        }

        .section {
            margin-bottom: 15px;
        }

        .section h4 {
            font-size: 1rem;
            color: #2980b9;
            margin-bottom: 5px;
        }

        .section p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
        }

        /* Read More Button Styles */
        .read-more-btn {
            background: none;
            border: none;
            color: #3498db;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0;
            margin-top: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .read-more-btn:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Project Proposals</h1>
            <p>Browse all available projects below</p>
        </header>
        
        <div id="projects-grid"></div>
    </div>

    <script>
        const projects = [
            {
                "id": 1,
                "title": "Metamaterial-inspired tunable planar sensor.",
                "summary": "Microwave resonance circuits have advantages in terms of their applicability, but these structures only emerge as the choice for fixed resonant frequency sensor with improved accuracy. However, in real world scenario, it is mainly required to develop the customized RF resonant structures that can be used over wide frequency range providing decent accuracy. As a matter of fact, the resonant frequency of these structures mainly depends on their physical dimensions and hence only static resonant structures (structure having fixed resonant frequency) can be realized. On the contrary, several applications like dielectric testing of dispersive material requires designing the sensor over a wider frequency range."
            },
            {
                "id": 2,
                "title": "Multi-band RF sensor for wide-band sensing.",
                "summary": "Microwave resonance circuits have advantages in terms of their applicability, but these structures only emerge as the choice for fixed resonant frequency sensor with improved accuracy. However, in real world scenario, it is mainly required to develop the customized RF resonant structures that can be used over wide frequency range providing decent accuracy. As a matter of fact, the resonant frequency of these structures mainly depends on their physical dimensions and hence only static resonant structures (structure having fixed resonant frequency) can be realized. On the contrary, several applications like dielectric testing of dispersive material requires designing the sensor over a wider frequency range."
            },
            {
                "id": 3,
                "title": "Electric LC resonator-derived sensor for complete material testing.",
                "summary": "Among the different metamaterial inspired structures, the ELC has been found to be more attractive than the others as it provides better sensitivity, linearity, and dynamic range. For dielectric sensing applications, till now only simple ELC resonators have been employed, thus limiting their sensitivity. The high sensitivity as well as selectivity of sensors is desired for many applications such as detection of small quantity of adulterant in the food product, accurate estimation of complete dielectric and magnetic properties of materials, etc."
            },
            {
                "id": 4,
                "title": "Sub-surface object detection through microwave sensor.",
                "summary": "Near field imaging is one of the many applications of microwave and millimeter wave that has fascinated the researchers during the last few years due to its application in a variety of fields such as malignant tissue detection in the biomedical field, subsurface corrosion detection in metals, crack detection, dielectric characterization, delamination in IC packages, water quality assessment, security checks at airport, malls etc. The main advantage of using the microwave imaging technology is its ability to penetrate the objects depending on its dielectric and magnetic behavior, and providing non-ionizing, non-destructive, and non-invasive testing environment."
            },
            {
                "id": 5,
                "title": "Design and development of a compact multi-functional antenna system for automotive vehicular applications",
                "summary": "Design and simulation of a compact, multi-functional antenna system for automotive vehicular applications (e.g., Vehicle-to-Everything (V2X), and Ultra-Wideband (UWB) for ranging,). Finally, designed antennas must be fabricated and tested to validate the simulation results."
            },
            {
                "id": 6,
                "title": "Design and development of conformal millimeter wave MIMO antenna system with stealth capabilities for UAV Applications",
                "summary": "Design and simulation of a compact and conformal MIMO antenna system for UAV applications (e.g., millimeter wave range, etc.) and its integration with UAV. Further, improvement in the stealth capabilities of the integrated UAV system through various RCS-reduction techniques. Finally, designed antennas must be fabricated and tested to validate the simulation results."
            },
            {
                "id": 7,
                "title": "Design and development of Substrate-integrated Dielectric resonator antenna array for Millimeter wave Applications",
                "summary": "Design and simulation of a planar substrate-integrated Dielectric resonator antenna array for Millimeter wave applications. Further, incorporate beamforming techniques to improve scanning. Finally, designed antennas must be fabricated and tested to validate the simulation results."
            },
            {
                "id": 8,
                "title": "Design and development of compact broadband planar antenna for direction finding applications",
                "summary": "Design and simulation of a compact, broadband planar antenna for direction finding. Finally, designed antennas must be fabricated and tested to validate the simulation results."
            },
            {
                "id": 9,
                "title": "Design of RF coupler.",
                "summary": "Couplers are important circuit components in RF & microwave applications. They are often used as a power divider/combiner with proper phases or as a part of a mixer. Among different available couplers, probably the most used couplers are rat-race couplers and branch-line quadrature hybrid couplers, TE 21 coupler etc. High performance RF & Microwave coupler design is the goal of the project."
            },
            {
                "id": 10,
                "title": "Design of Frequency Selective Surface",
                "summary": "Frequency Selective Surface (FSS) is a spatial filter. It allows to pass signals having some frequency bands and rejects certain frequency bands. FSSs are periodic structures whose resonances depend on their unit cell geometries. In case of parallel resonance, FSS acts as open circuit at resonance frequency and becomes transparent. On the other hand, in case of series resonance, it acts as short circuit and becomes opaque. High performance FSS design is the goal of the project."
            },
            {
                "id": 11,
                "title": "Antenna design for 5G communication system.",
                "summary": "Enormous increase of number of mobile user, requirement of sending large data triggers the development of fifth mobile generation (5G) mobile communication standard which can deal with high data rate. To provide such high data rate, communication systems need to be switched in mm wave frequency. However, atmospheric path loss in mm wave frequency bands is very high. To compensate this path loss, high gain antenna is essential. This high gain which is needed to compensate path loss can’t be achieved through single antenna. Array designing is inevitable for this. High performance 5G antenna design is the goal of the project."
            },
            {
                "id": 12,
                "title": "Design and development of antenna for 6G communication system.",
                "summary": "6G communication is the next-generation cellular technology planned to be significantly faster and more integrated than 5G, utilizing higher frequency bands. To design antenna for 6G communication, it is needed to explore different architectures of antenna in Sub-THz band and beyond. Moreover, design, simulation, and optimization of beamforming network and then complete array antenna is also a challenging task. Here, realization and fabrication of the antenna with its beamforming network is completely different. It is preferred to design the antenna in on package or on an IC chip. So, compactness along with large band with is challenge in this design. High performance 6G antenna design is the goal of the project."
            },
            {
                "id": 13,
                "title": "Design of SIW based filter / multiplexer network for mm-wave applications",
                "summary": "Substrate Integrated Waveguide (SIW) technology enables low-loss, highly integrated filter and multiplexer networks for millimeter-wave (mm-wave) 5G and radar systems. By utilizing metallic via holes and dielectric substrates, SIW networks merge the high quality-factor (Q) of traditional waveguides with planar circuit benefits. Design Principles Cavity Resonators: Formed using periodic metallized vias to confine electromagnetic fields in specific transverse electric (TE) modes. Coupling Structures: Utilizes iris windows, slots, or perturbations between adjacent cavities to control bandwidth and transmission zeros. Multiplexer Integration: Combines multiple channel filters via a common junction or manifold to route distinct mm-wave bands with minimal insertion loss. Key Advantages Low Loss: Significantly lower conductor and radiation losses than standard microstrip lines at high frequencies. Compact Footprint: Planar manufacturing allows seamless integration with active and passive monolithic microwave integrated circuits (MMICs)"
            },
            {
                "id": 14,
                "title": "Design of SIW based beam-forming network for mm-wave applications",
                "summary": "Substrate Integrated Waveguide (SIW) technology enables low-loss, compact, and low-cost beam forming networks for millimeter-wave applications. Core Design Principles Structure: Formed using periodic metallic via-hole arrays inside a dielectric substrate, confining electromagnetic energy like traditional rectangular waveguides. Integration: Allows seamless planar integration with active devices, microstrip lines, and antenna arrays on standard printed circuit boards. Topology: Commonly utilizes Butler matrices, directional couplers, and phase shifters to steer radiation beams precisely at frequencies like 26 GHz and 28 GHz. Performance Advantages Low Loss: Minimizes high-frequency conductor and dielectric losses typical of conventional microstrip networks. Miniaturization: Achieves significant size reduction vital for 5G mobile handsets and base stations."
            },
            {
                "id": 15,
                "title": "Design of SIW based monopulse comparator network for Ku-band radar",
                "summary": "A Substrate Integrated Waveguide (SIW) monopulse comparator network for Ku-band radar uses planar magic tees or hybrid couplers to process four antenna quadrant signals into precise sum (Σ) and difference (Δ) tracking channels. It offers low insertion loss, high port isolation, and a compact planar footprint. Core Architecture and Operation Substrate Integration: Formed using periodic metallic via-holes on high-frequency dielectric substrates, replacing bulky metallic waveguides with lightweight, low-cost planar structures. Junction Design: Utilizes H-plane and E-plane slot couplers or integrated magic tees to manage in phase power combining and phase inversion. Signal Generation: Yields one sum port for target detection alongside azimuth and elevation difference ports for precise angular tracking. Performance Characteristics Bandwidth & Matching: Operates efficiently across the Ku-band frequency spectrum with a strong return loss (>13 dB) at all access ports. Imbalance Control: Maintains strict amplitude balance (<0.2 dB) and phase balance (<2°) to preserve deep null depths (>30 dB) in difference radiation patterns."
            },
            {
                "id": 16,
                "title": "Design of aperture coupled SIW slot array antenna for Ku-band monopulse radar",
                "summary": "An aperture-coupled substrate integrated waveguide (SIW) slot array antenna for Ku-band monopulse radar achieves low profile, high gain, and precise angular tracking. Architecture and Operation Substrate Configuration: Built using a multi-layer planar PCB process, integrating a lower microstrip/SIW feeding network layer and an upper radiating slot layer. Aperture Coupling: Utilizes narrow transverse or longitudinal slots etched in the intermediate ground plane to transfer electromagnetic energy smoothly from the feed line to the radiating slots while suppressing spurious backend radiation. Monopulse Capability: Employs hybrid-fed or dual-mode cavity configurations to generate the required sum (Σ) and difference (Δ) patterns for precise target direction-finding. Performance Factors Bandwidth and Match: Provides an optimized reflection coefficient (S₁₁ < -10 dB) across the target Ku band spectrum. Isolation: Maintains high port isolation between the sum and difference channels for accurate error signal extraction."
            },
            {
                "id": 17,
                "title": "Design and Development of HF Band High Power Amplifier for PECVD applications",
                "summary": "This project focuses on the design, PCB implementation, and testing of a 100 W high-frequency (HF) power amplifier operating at the 13.56 MHz ISM band for plasma-enhanced chemical vapor deposition (PECVD) applications. The amplifier will be designed to deliver high output power with high efficiency and reliable operation. A high-efficiency switching-mode architecture, together with an optimized impedance matching network, will be employed to minimize power dissipation and ensure stable operation. The design will emphasize efficient thermal management, harmonic suppression, and robust load tolerance. The proposed amplifier provides a compact and energy-efficient RF power source suitable for PECVD systems."
            },
            {
                "id": 18,
                "title": "Design and Development of a Six-Port Modulator for Wireless Communication Applications",
                "summary": "This project focuses on the design, PCB implementation, and testing of a six-port modulator for wireless communication applications. Unlike conventional transmitter architectures that rely on active mixers, the proposed modulator employs a passive six-port network comprising hybrid couplers, power dividers, and phase-shifting elements to generate digitally modulated RF signals. Information is encoded by controlling the reflection coefficients of variable impedance loads, enabling efficient amplitude and phase modulation with reduced hardware complexity and improved linearity."
            },
            {
                "id": 19,
                "title": "Design and Development of an L-band Low Noise Amplifier for GNSS Receivers",
                "summary": "This project focuses on the design, PCB implementation, and testing of a wideband L-band low-noise amplifier (LNA) for Global Navigation Satellite System (GNSS) receivers. The design will emphasize a low noise figure, high gain, excellent input and output impedance matching, unconditional stability, and low power consumption to meet the stringent requirements of multi-constellation GNSS receivers. Matching networks will be optimized to achieve broadband performance across the entire L-band while maintaining stable operation. Circuit simulation and optimization will be carried out to evaluate key performance metrics, including gain, noise figure, return loss, stability factor, and linearity."
            },
            {
                "id": 20,
                "title": "Design and Development of an Outphasing Power Amplifier for 5G/6G Communications",
                "summary": "This project focuses on the design, PCB implementation, and testing of an Outphasing Power Amplifier (OPA) for sub-6 GHz 5G/6G communication systems, which demand high efficiency and linearity while transmitting wideband, high peak-to-average power ratio (PAPR) signals. The outphasing architecture improves efficiency by decomposing the input signal into two constant-envelope signals that are independently amplified using highly efficient power amplifiers and subsequently combined to reconstruct the desired output signal. The OPA will be implemented using off-the-shelf GaN HEMTs to achieve high output power and efficiency. The complete circuit will be designed and optimized using Keysight ADS, followed by PCB fabrication and experimental validation. The objective is to achieve high drain efficiency over a wide output power range, while maintaining adequate gain, linearity, and bandwidth suitable for next-generation 5G/6G base stations and massive MIMO applications."
            }
        ];

        // How many characters to show before cutting off the text
        const MAX_SUMMARY_LENGTH = 140;

        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            let htmlContent = '';

            projects.forEach(project => {
                // Determine if we need a Read More button
                const isLong = project.summary.length > MAX_SUMMARY_LENGTH;
                const shortSummary = isLong ? project.summary.substring(0, MAX_SUMMARY_LENGTH) + "..." : project.summary;
                
                // Escape quotes so they don't break the HTML attributes
                const safeFullSummary = project.summary.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                const safeShortSummary = shortSummary.replace(/'/g, "&#39;").replace(/"/g, "&quot;");

                // Start building the card
                let cardHtml = `
                    <div class="card">
                        <h3 class="project-title">${project.id}. ${project.title}</h3>
                        
                        <div class="section">
                            <h4>Summary</h4>
                            <p class="summary-text" data-full="${safeFullSummary}" data-short="${safeShortSummary}">
                                ${safeShortSummary}
                            </p>
                            ${isLong ? `<button class="read-more-btn" onclick="toggleSummary(this)">Read More</button>` : ''}
                        </div>
                `;

                cardHtml += `</div>`; // Close card
                htmlContent += cardHtml;
            });

            grid.innerHTML = htmlContent;
        }

        // Function to handle the Read More / Read Less click
        function toggleSummary(btn) {
            const summaryPara = btn.previousElementSibling;
            const fullText = summaryPara.getAttribute('data-full');
            const shortText = summaryPara.getAttribute('data-short');

            if (btn.innerText === "Read More") {
                summaryPara.innerText = fullText;
                btn.innerText = "Read Less";
            } else {
                summaryPara.innerText = shortText;
                btn.innerText = "Read More";
            }
        }

        // Run the render function when the page loads
        window.onload = renderProjects;
    </script>
</body>
</html>
