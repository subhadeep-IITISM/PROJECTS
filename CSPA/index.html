<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Wireless & ML Project Proposals</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* Grid layout for all projects */
        #projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .project-title {
            font-size: 1.25rem;
            color: #34495e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            line-height: 1.4;
        }

        .section {
            margin-bottom: 15px;
        }

        .section h4 {
            font-size: 1rem;
            color: #2980b9;
            margin-bottom: 5px;
        }

        .section p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
        }

        /* Read More Button Styles */
        .read-more-btn {
            background: none;
            border: none;
            color: #3498db;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0;
            margin-top: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .read-more-btn:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Future Wireless & ML Project Proposals</h1>
            <p>Browse all available projects below</p>
        </header>
        
        <!-- This is where all the project cards will be generated -->
        <div id="projects-grid"></div>
    </div>

    <script>
        const projects = [
            {
                "id": 1,
                "title": "Machine Learning (ML)/ Deep Learning (DL) For Future Wireless Communications",
                "summary": "In this project, the potential benefits of machine learning (ML)/ Deep Learning (DL) techniques would be harnessed for the performance enhancement of conventional wireless communication system. Overall, this project would towards improving the reliability as well as security of the transmitted information with the aid of ML/DL techniques.",
                "prerequisites": "N/A"
            },
            {
                "id": 2,
                "title": "Cooperative reconfigurable intelligent surfaces (RIS)/ simultaneous transmitting and reflecting reconfigurable intelligent surfaces (STAR-RIS) aided wireless systems for 6G communications",
                "summary": "In this project, the novel cooperative strategies for RIS as well as STAR-RIS would be developed in order to improve the coverage as well as the reliability of the transmitted signal in a highly dense environment. Further, the spectrally efficient techniques namely power domain non orthogonal multiple access (PD-NOMA) and rate splitting multiple access (RSMA) would be exploited.",
                "prerequisites": "N/A"
            },
            {
                "id": 3,
                "title": "Non-Terrestrial Networks (NTNs) for 6G Communications",
                "summary": "In this project, the aerial platforms such as unmanned aerial vehicles (UAVs), high-altitude platforms (HAPs), and satellites would be exploited so as to maintain the connectivity in densely populated areas. Further, the promising technology such as UAV mounted RIS/STAR-RIS would be exploited under this project.",
                "prerequisites": "N/A"
            },
            {
                "id": 4,
                "title": "Low-rank channel estimation for RIS (Reconfigurable Intelligent Surface) assisted wireless systems",
                "summary": "The hostile multipath environment in wireless having obstacles that block, reflect and scatter signals unpredictably, can be controlled using smart surfaces that are capable of adjusting the phase of each element. The signals can now be programmed to be reflected at the best advantage of constructive interference in different independent spatial patterns: This is RIS, an active area of research is not yet standardized for 5G and is a potential candidate of 6G for coverage extension and better energy efficiency. Work-plan: Review the SOA of RIS technology. Learning the fundamental concepts of RIS and methods of developing MATLAB simulation frameworks for the cascaded channel models to investigate the inherent low-rank properties and how optimized RIS affects correlation in MIMO channel paths under different scenarios of scattered clusters (this area is not yet well- explored in analysing performance trade-offs); Also develop a matrix completion framework using nuclear norm minimization.",
                "prerequisites": "N/A"
            },
            {
                "id": 5,
                "title": "Dictionary Learning based mmwave Channel estimation",
                "summary": "mm Wave channels with few dominant propagation paths are sparse in the angular domain because there are only a few paths. This sparsity can be exploited by a proper representation with a learned dictionary from correlated mmWave MIMO channel matrices. The learned dictionary adapts to the spatial correlation present in the channels, providing a better basis for sparse representation and enabling more efficient channel estimation. Work-plan : To generate synthetic and realistic ( Quadriga-based) mmWave channel using geometric models with sparse multipath, as training and test channels with various types correlation models. Learn one of the basic Dictionary learning algorithm like K-SVD from training channel realizations. And compare with DFT dictionary to estimate the channel from compressed pilots, analysing normalized mean squared error (NMSE) as a function of SNR.",
                "prerequisites": "N/A"
            },
            {
                "id": 6,
                "title": "Orthogonal Matching Pursuit Frameworks for Sparse Channel Estimation in mmWave Massive MIMO Systems",
                "summary": "mmWave channels are ideal candidates for compressed sensing techniques like OMP. However, conventional OMP approaches face challenges including high computational complexity, significant pilot overhead, and performance degradation in low SNR scenarios. Additionally, hardware impairments in mmWave transceivers further complicate accurate channel estimation. Work plan: Study mmWave channel sparsity models (such as Saleh-Valenzuela cluster model) on these aspects and implement the standard OMP algorithm, and then develop a comprehensive performance evaluation framework (for NMSE, spectral efficiency, beam forming gain etc.) for single-user scenarios.",
                "prerequisites": "Must have studied Digital Communication and / or Wireless Communication at UG or PG level, and basic beginner’s programming skills in MATLAB is required"
            },
            {
                "id": 7,
                "title": "Counterfactual-Validated Concept Suppression for Robust CNNs and Vision Transformers",
                "summary": "CNNs and Vision Transformers can achieve high classification accuracy by exploiting spurious visual correlations such as backgrounds, textures, colours, watermarks or co-occurring objects instead of learning class-relevant features. This project will develop a framework for automatically discovering and suppressing such shortcut concepts. Candidate concepts will be identified using attribution maps, object masks and clustered visual features. Object-preserving counterfactual images will then be generated by modifying suspected concepts while retaining the original foreground object and class label. Concepts whose modification causes a significant prediction change will be treated as verified shortcuts. A consistency-based and concept-suppression objective will subsequently reduce the model’s dependence on these features. CNN and Transformer architectures will be compared using average accuracy, worst-group accuracy, calibration, counterfactual robustness and explanation quality.",
                "prerequisites": "Python, PyTorch, deep learning, CNNs, Vision Transformers, linear algebra and basic probability; familiarity with explainable AI or image segmentation is desirable."
            },
            {
                "id": 8,
                "title": "Uncertainty-Calibrated Multi-Layer DINOv3 Features for Reliable Dense Correspondence and Annotation Propagation",
                "summary": "DINOv3 produces semantically meaningful dense features, but direct nearest-neighbour matching does not indicate whether a correspondence is reliable, and different network layers may perform differently under changes in viewpoint, scale, illumination and object deformation. This project will develop a lightweight, uncertainty-aware framework that adaptively combines features from multiple DINOv3 layers and resolutions for dense correspondence across images or video frames. Match confidence will be learned using forward–backward cycle consistency, local geometric agreement and augmentation invariance without requiring dense correspondence annotations. Unreliable matches will be rejected or corrected before being used to propagate points, masks or sparse labels. The framework will be evaluated for point tracking, video mask propagation, correspondence calibration and robustness under controlled domain shifts.",
                "prerequisites": "Python, PyTorch, Vision Transformers, linear algebra and basic probability; familiarity with image matching or segmentation is desirable."
            },
            {
                "id": 9,
                "title": "Budget-Aware Adaptive Query Selection and Track Renewal for CoTracker3",
                "summary": "CoTracker3 commonly tracks manually selected points or points sampled from a uniform image grid, although many selected points may be poorly textured, redundant, occluded or irrelevant to the downstream task. This project will develop an adaptive query-management framework that selects a limited set of informative and trackable points under a fixed computational budget. A lightweight query-quality model will combine local appearance, spatial coverage, motion diversity and predicted visibility to initialize points. During video processing, unreliable or redundant trajectories will be retired, while new points will be introduced in uncovered or dynamically important regions. The proposed method will operate on top of a frozen CoTracker3 model and will be evaluated using tracking accuracy, trajectory survival, spatial coverage, mask-propagation quality, runtime and memory consumption.",
                "prerequisites": "Python, PyTorch, CNNs or Transformers, video processing and basic understanding of point tracking or optical flow."
            },
            {
                "id": 10,
                "title": "AI-Assisted Hybrid Beamforming for Wireless Communication Systems",
                "summary": "Millimeter-wave and terahertz communications require hybrid analog-digital beamforming to overcome severe propagation losses while maintaining reasonable hardware complexity. This research develops an AI-assisted hybrid beamforming framework using deep neural networks to jointly optimize analog phase shifters and digital beamforming weights. The proposed approach reduces computational complexity while maximizing spectral efficiency and energy efficiency. Simulation studies under realistic channel conditions will evaluate beamforming gain, BER, and achievable data rates, making the framework suitable for ultra-high-speed 6G communication systems.",
                "prerequisites": "N/A"
            },
            {
                "id": 11,
                "title": "Machine Learning-Based Image Enhancement for Low-Light and Adverse Weather Conditions",
                "summary": "This research focuses on developing machine learning algorithms to enhance images captured under low-light, foggy, rainy, or hazy conditions. Deep learning models such as convolutional neural networks (CNNs) and diffusion models will be employed to improve brightness, contrast, and color fidelity while preserving fine details. The proposed framework aims to increase the visibility and quality of images used in surveillance, autonomous vehicles, intelligent transportation systems, and security monitoring. Performance will be evaluated using PSNR, SSIM, and perceptual quality metrics, demonstrating improved image restoration under challenging environmental conditions.",
                "prerequisites": "N/A"
            },
            {
                "id": 12,
                "title": "Hardware implementation of an OTFS waveform-based transceiver on FPGA based software defined radio (RFSoC/ZCU 102/Zedboard) for beyond-5G/6G communications.",
                "summary": "This work is related to a project sponsored by DRDO Govt. of India. In this project, our main focus will be to implement the basic building blocks of transmitter and receiver, such as channel estimator, synchronizer and equalizer for OTFS based wireless systems. This implementation will be done on FPGA based SDR board (RFSoC/ZCU 102/ Zed board) using C/Verilog/VHDL. Moreover, Python also can be suitable for this implementation. This will be useful for the next generation of wireless systems.",
                "prerequisites": "N/A"
            },
            {
                "id": 13,
                "title": "AI/ML based design of wireless systems based on OTFS waveform along with Intelligent Reflecting Surface (IRS).",
                "summary": "This work is related to a Project sponsored by ANRF Govt. of India. In this project, our main focus will be to develop Machine Learning Techniques to address the channel and data estimation, as well as optimization of reflecting elements for OTFS based IRS system. This will be useful for the next generation of wireless systems.",
                "prerequisites": "N/A"
            },
            {
                "id": 14,
                "title": "Design of Novel optimization algorithms for IRS assisted Terahertz (THz) wireless systems.",
                "summary": "This work is related to a Project sponsored by DOT Govt. of India. In this project, we will propose novel optimization algorithms to design reflection coefficients for IRS assisted THz wireless systems. Here coefficients will be designed with an objective of maximization of secrecy rate or sum-rate. This will be useful for the next generation of wireless systems.",
                "prerequisites": "N/A"
            },
            {
                "id": 15,
                "title": "Wireless Sensor Network or IoT-enabled system for the sensing of Environmental and Industrial parameters",
                "summary": "Degradation of environmental parameters and climate change are major concerns nowadays. Because of these concerns, the development of an accurate, scalable, real-time, energy-efficient monitoring solution for measuring environmental parameters is necessary. For environmental monitoring, a number of distributed devices are to be used, and they need to be located at different locations. Then there is a need for data acquisition and communication across heterogeneous ecosystems. Wireless sensor networks (WSNs) enable an innovative approach to pervasive environmental monitoring. In this project, a WSN-based system will be designed for measuring environmental and industrial parameters. The sensing system may be integrated with the Internet of Things (IOT) to perform in a real-time scenario to ensure reliable performance in real-time conditions. This work will involve the fabrication, characterization, and testing of the sensor, along with the development of a reader unit that offers a reliable, low-cost, scalable solution for real-time monitoring.",
                "prerequisites": "N/A"
            },
            {
                "id": 16,
                "title": "Design and fabrication of a Surface Acoustic Wave Sensor-based, Battery-less Methane Detection System",
                "summary": "The detection and control of various toxic gases present in our environment is the utmost concern today. They affect not only the air quality index but also human health. Among these gases, volatile organic carbon (VOCs) gases are of major concern. For example, VOCs like Dichloromethane (DCM) gas has potential for damaging the central nervous system. Such gases are responsible for environmental degradation, like global warming. Hence, it is the need of the hour to design a gas sensor that can detect these VOC gases, especially DCM gas. This project aims to develop a highly sensitive and selective Surface Acoustic Wave (SAW) gas sensor for Dichloromethane detection, and its integration with the microcontroller-based real-time display unit to perform measurement in a real-time scenario. The advantages of SAW technology include low power consumption, compact size, and fast response times, and wireless operation. The proposed SAW methane sensor will utilize a sensing layer functionalized with materials specifically tailored to interact with methane molecules. This work will involve the fabrication, characterization, and testing of the sensor. The aim of this work is to provide an innovative SAW-based Dichloromethane detection technology that offers a reliable, low-cost, scalable solution for real-time monitoring and early detection of Dichloromethane leaks. Further, the system will be made IoT-enabled for real-time representation.",
                "prerequisites": "N/A"
            },
            {
                "id": 17,
                "title": "Adaptive Pilot and Reference Signal Design for Integrated Sensing and Communication (ISAC)",
                "summary": "Integrated Sensing and Communication (ISAC) is a key enabling technology for 6G wireless systems, where the same transmitted waveform and radio resources are utilized for both data communication and environmental sensing. This project aims to investigate the design of adaptive pilot/reference signals for joint channel estimation and sensing. An adaptive pilot design will be developed based on channel conditions, mobility, or sensing requirements, with the objective of reducing pilot overhead while maintaining reliable communication and sensing performance. The proposed methods will be evaluated through MATLAB-based simulations using metrics such as BER, NMSE, sensing accuracy, and spectral efficiency.",
                "prerequisites": "Digital Communication, Signal Processing, basic Wireless Communication, and MATLAB programming."
            },
            {
                "id": 18,
                "title": "Delay–Doppler Domain Channel Estimation for High-Mobility Wireless Communication Systems",
                "summary": "Future wireless networks are expected to support high-mobility scenarios such as high speed trains, UAVs, and satellite/non-terrestrial networks, where conventional channel estimation techniques can suffer from rapidly varying channels and large Doppler shifts. This project focuses on channel estimation in the delay–Doppler domain for high-mobility wireless communication systems, with particular emphasis on OTFS modulation. It will develop a delay–Doppler channel model and investigate pilot-based estimation of channel parameters such as path gain, delay, and Doppler shift. The project will explore techniques for estimating fractional delay and Doppler components and evaluate their impact on communication performance.",
                "prerequisites": "Digital Communication, Signal Processing, basic Wireless Communication, and MATLAB programming."
            },
            {
                "id": 19,
                "title": "Learning-Assisted Target Detection and Parameter Estimation for 6G Integrated Sensing and Communication",
                "summary": "Integrated Sensing and Communication (ISAC) enables future wireless transceivers to simultaneously communicate with users and sense surrounding objects or targets. This project aims to investigate learning-assisted signal processing for target detection and parameter estimation in an ISAC system. A simulation framework will first be developed to generate received signals corresponding to multiple targets characterized by different ranges, velocities, and signal strengths. Conventional signal-processing methods for target detection and delay–Doppler estimation will be implemented as benchmarks. Machine-learning or deep-learning techniques will subsequently be explored for improving target detection and parameter estimation under challenging conditions such as low SNR, closely spaced targets, or imperfect channel information. The performance of learning-based and conventional approaches will be compared in terms of detection probability, estimation error, computational complexity, and robustness.",
                "prerequisites": "Digital Signal Processing, Digital Communication, Wireless Communications, MATLAB/Python programming, and basic knowledge of machine learning."
            },
            {
                "id": 20,
                "title": "Robust Link Adaptation for Ultra-Reliable and Low-Latency Communication.",
                "summary": "The primary objective of this project is to develop analytical frameworks and machine learning algorithms to optimize the scheduling of resources (i.e., modulation and coding schemes, power control, etc.) in the physical layer. The scheduling of radio resources can achieve robustness against mobility-related changes in fading channel statistics and time-varying interference. Specifically, it aims to model the statistical distribution of changes in signal-to-interference plus noise (SINR) ratios between two consecutive time slots to capture the time-varying behavior of fading channels and interference. Based on the development of analytical frameworks of statistical distributions, a devised backoff selection method will propose to achieve target wireless link reliability within the latency budget.",
                "prerequisites": "N/A"
            },
            {
                "id": 21,
                "title": "UAVs Trajectory Modeling for Reliable Control and Command Operations.",
                "summary": "Real-time automation and control of unmanned aerial vehicles (UAVs) demand frequent transmissions of short packets. The trajectory of UAVs for short packet communication will be modeled to guarantee the reliability of control and command signals from the ground control station. An optimal multiple access scheme will be developed to control the swarms of UAVs to provide surveillance operations in border areas. Moreover, deep reinforcement learning (DRL) based non-central distributed resource scheduling algorithms will be developed to guarantee real-time automation and control of robotic machines in the factory. The factory environment will be modeled as the non-stationary Markov Decision Process (MDP) to adapt the resource allocation among the robotic machines to ensure that the same radio resources will not be utilized by multiple machines.",
                "prerequisites": "N/A"
            },
            {
                "id": 22,
                "title": "Design and Performance Evaluation of a Quantum Key Distribution System for Secure Wireless Communication",
                "summary": "This research aims to design and evaluate a Quantum Key Distribution (QKD) framework for secure wireless communication over Free-Space Optical (FSO) channels, with a primary focus on Continuous-Variable QKD (CV-QKD). The proposed work investigates Gaussian-modulated coherent state (GMCS) CV-QKD, where secret keys are encoded in the amplitude and phase quadratures of coherent optical states. A realistic FSO channel model incorporating atmospheric attenuation, turbulence-induced fading, channel noise, and potential eavesdropping effects will be developed to assess the robustness of quantum key distribution under practical wireless conditions. The performance of homodyne and heterodyne detection schemes will be analyzed and compared in terms of secure key generation. System performance will be evaluated using key metrics including secret key rate (SKR), excess noise, channel transmittance, reconciliation efficiency, and communication reliability. The study is expected to establish an optimized QKD-based wireless communication framework that enhances secure key distribution and provides insights into the deployment of practical quantum-secure wireless communication systems over free-space optical channels.",
                "prerequisites": "N/A"
            },
            {
                "id": 23,
                "title": "Quantum Algorithms, Krylov Methods, and Machine Learning for Optimization",
                "summary": "Combinatorial optimization, system eigenvalue estimation, and high-dimensional data analysis represent major computational bottlenecks across engineering disciplines. This project investigates a unified framework that integrates Variational Quantum Algorithms (such as QAOA), Quantum Krylov Subspace methods (such as Quantum Lanczos), and Quantum Machine Learning (QML) models to address these challenges. Students will evaluate how variational parameterized circuits search discrete decision spaces, how quantum Krylov subspace expansion utilizes real-time quantum state evolution to bypass optimization trainability traps like barren plateaus, and how QML architectures construct quantum feature maps to assist classical optimization solvers. Using quantum software SDKs like Qiskit or PennyLane, students will implement these paradigms on simulated noisy quantum hardware to benchmark their convergence rates, circuit depth requirements, sampling overhead, and noise resiliency against standard classical solvers.",
                "prerequisites": "Mathematics: Linear Algebra (vectors, matrices, unitary transformations), basic probability, and classical optimization concepts. Programming: Python (NumPy, SciPy) and willingness to learn quantum SDKs (Qiskit or PennyLane)."
            },
            {
                "id": 24,
                "title": "Model-Informed Machine Learning for Wireless Communication",
                "summary": "While purely data-driven \"black-box\" deep neural networks (DNNs) have been applied to physical-layer communications, they demand massive training datasets, lack interpretability, and degrade severely when exposed to out-of-distribution channel conditions. Model-informed machine learning bridges classical communication theory and deep learning by unfolding iterative signal processing algorithms (such as ISTA or AMP) into layer-by-layer trainable neural networks. In this project, students will design a model-informed neural network (such as kalmannet) curated for communication systems.",
                "prerequisites": "Mathematics: Matrix calculus, linear algebra, and estimation theory. Programming: Python (PyTorch or TensorFlow). Domain Knowledge: Fundamentals of Wireless Communications and Digital Signal Processing (signals, linear systems, channel models)."
            },
            {
                "id": 25,
                "title": "Signal Processing and Machine Learning for CV-QKD Systems",
                "summary": "Continuous-Variable Quantum Key Distribution (CV-QKD) allows quantum-secured cryptographic key exchange over standard optical fiber infrastructure using coherent optical detection. However, practical deployments suffer from environmental disturbances—such as laser phase drift, thermal fluctuations, and polarization shifts—which introduce \"excess noise\" into the received quantum data. If excess noise exceeds a strict theoretical bound, the secret key generation rate drops to zero. In this project, students will design an adaptive Digital Signal Processing (DSP) pipeline integrated with machine learning sequence estimators to track and mitigate real-time phase noise at the CV-QKD receiver. Students will build a simulation model of coherent state transmission through optical fiber, implement pilot-assisted ML/DSP algorithms to equalize quadrature data, and evaluate the resulting reduction in excess noise to determine the achievable Secure Key Rate (SKR) across operational distances.",
                "prerequisites": "Mathematics: Random processes, probability theory, and basic calculus. Programming: Matlab/Python. Domain Knowledge: Digital Signal Processing (filtering, estimation) and basic concepts of quantum communication."
            }
        ];

        // How many characters to show before cutting off the text
        const MAX_SUMMARY_LENGTH = 140;

        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            let htmlContent = '';

            projects.forEach(project => {
                // Determine if we need a Read More button
                const isLong = project.summary.length > MAX_SUMMARY_LENGTH;
                const shortSummary = isLong ? project.summary.substring(0, MAX_SUMMARY_LENGTH) + "..." : project.summary;
                
                // Escape quotes so they don't break the HTML attributes
                const safeFullSummary = project.summary.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                const safeShortSummary = shortSummary.replace(/'/g, "&#39;").replace(/"/g, "&quot;");

                // Start building the card
                let cardHtml = `
                    <div class="card">
                        <h3 class="project-title">${project.id}. ${project.title}</h3>
                        
                        <div class="section">
                            <h4>Summary</h4>
                            <p class="summary-text" data-full="${safeFullSummary}" data-short="${safeShortSummary}">
                                ${safeShortSummary}
                            </p>
                            ${isLong ? `<button class="read-more-btn" onclick="toggleSummary(this)">Read More</button>` : ''}
                        </div>
                `;

                // Only show Prerequisites if it's not "N/A"
                if (project.prerequisites && project.prerequisites !== "N/A") {
                    cardHtml += `
                        <div class="section">
                            <h4>Prerequisites</h4>
                            <p>${project.prerequisites}</p>
                        </div>
                    `;
                }

                cardHtml += `</div>`; // Close card
                htmlContent += cardHtml;
            });

            grid.innerHTML = htmlContent;
        }

        // Function to handle the Read More / Read Less click
        function toggleSummary(btn) {
            const summaryPara = btn.previousElementSibling;
            const fullText = summaryPara.getAttribute('data-full');
            const shortText = summaryPara.getAttribute('data-short');

            if (btn.innerText === "Read More") {
                summaryPara.innerText = fullText;
                btn.innerText = "Read Less";
            } else {
                summaryPara.innerText = shortText;
                btn.innerText = "Read More";
            }
        }

        // Run the render function when the page loads
        window.onload = renderProjects;
    </script>
</body>
</html>
