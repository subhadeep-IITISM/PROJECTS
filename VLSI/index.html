<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLSI Design Project Proposals</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* Grid layout for all projects */
        #projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .project-title {
            font-size: 1.25rem;
            color: #34495e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            line-height: 1.4;
        }

        .section {
            margin-bottom: 15px;
        }

        .section h4 {
            font-size: 1rem;
            color: #2980b9;
            margin-bottom: 5px;
        }

        .section p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
        }

        /* Read More Button Styles */
        .read-more-btn {
            background: none;
            border: none;
            color: #3498db;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0;
            margin-top: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .read-more-btn:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>VLSI Design Project Proposals</h1>
            <p>Browse all available projects below</p>
        </header>
        
        <!-- This is where all the project cards will be generated -->
        <div id="projects-grid"></div>
    </div>

    <script>
        const projects = [
            {
                "id": 1,
                "title": "FPGA-based Synchronization System for Airborne UAV Communication Application",
                "summary": "This work involves customizing electronic system of a standard UAV (drone) for local communication in airborne condition. A standard communication protocol will be implemented into FPGA and the same will be integrated with the flight controller of the drone for airborne communication.",
                "prerequisites": "No",
                "interdisciplinary": "No"
            },
            {
                "id": 2,
                "title": "Integration of sensor, electronics and power source on flexible substrate for health monitoring application",
                "summary": "Building precise with low-cost health monitoring system is necessity for hour country. The same can be achieved by integrating all the components like, sensor, electronics (analog & digital) and power source in compact manner on a flexible substrate. The work involves this integration followed by multiple optimizations to achieved the desired/optimum performance.",
                "prerequisites": "No",
                "interdisciplinary": "No"
            },
            {
                "id": 3,
                "title": "2D Material based on chip antenna fabrication",
                "summary": "2D materials (2DM), especially Graphene/hBN have potential for THz communication, however, the same is not fully explored yet for on chip antenna. This work involves, fabrication and characterization of different 2DM on-chip antenna and explore engineering techniques like substrate/defect engineering for performance enhancement.",
                "prerequisites": "No",
                "interdisciplinary": "Yes, with Prof. Ravi K. Gangwar, Department of Electronics Engineering."
            },
            {
                "id": 4,
                "title": "Design of Resilient SRAM Architectures for Efficient VLSI Circuits in Embedded Computing Systems",
                "summary": "Design and develop resilient SRAM architectures for improved performance, low-power, and reliable embedded computing systems. Analyze SRAM performance with respect to read/write stability, static noise margin (SNM), access time(speed of operation), leakage power and dynamic power.",
                "prerequisites": "Basic knowledge of Digital Electronics, CMOS/VLSI Design, Semiconductor Device Physics, Embedded System Design, and Memory Architectures. Familiarity with suitable EDA tools, Cadence Virtuoso, etc.",
                "interdisciplinary": "N/A"
            },
            {
                "id": 5,
                "title": "Design and evaluation of High-Coverage & Enhanced Fault detection techniques for Testing of VLSI Circuits",
                "summary": "Explore high-coverage testing methodologies to improve the reliability and fault detection capability of digital VLSI circuits. Study and analyze common possible VLSI faults, with including stuck-at faults, transition faults, bridging faults, delay faults, and path delay faults.",
                "prerequisites": "N/A",
                "interdisciplinary": "N/A"
            },
            {
                "id": 6,
                "title": "Cap-Layer & Gate Dielectric Engineering in polar GaN HEMT",
                "summary": "Explore the role of cap-layer and gate dielectric engineering in enhancing the electrical performance and reliability of polar GaN High Electron Mobility Transistors (HEMTs).",
                "prerequisites": "N/A",
                "interdisciplinary": "N/A"
            },
            {
                "id": 7,
                "title": "AI-driven Modeling of 3D Heterogeneous ICs",
                "summary": "Three-dimensional heterogeneous integrated circuits (3D-HICs) offer unprecedented performance and functional density but face critical challenges in thermal management, interconnect reliability, and device variability. Artificial Intelligence and Machine Learning (AI/ML) provide a promising augmentation by enabling fast, data-driven prediction.",
                "prerequisites": "Fundamentals of VLSI Design, Basic AI/ML coding skill",
                "interdisciplinary": "N/A"
            },
            {
                "id": 8,
                "title": "Development of Assistive Device for Parkinson’s patients",
                "summary": "Parkinson’s patients often experience impaired motor control, necessitating rehabilitation and assistive technologies to restore functional independence. Hybrid brain–computer interfaces (BCIs) that integrate electroencephalography (EEG) and electromyography (EMG) signals offer a promising pathway to decode motor intentions with higher accuracy and robustness.",
                "prerequisites": "Good understanding on signal processing algorithms and its implementation on hardware is expected.",
                "interdisciplinary": "N/A"
            },
            {
                "id": 9,
                "title": "Ultra-Low Latency Drone Perception via Neuromorphic FPGA Design",
                "summary": "Real-time aerial image analysis with ultra-low latency is crucial for autonomous drone applications in surveillance, agriculture, and disaster management.",
                "prerequisites": "Basic understanding of Verilog/VHDL coding and FPGA is expected.",
                "interdisciplinary": "N/A"
            },
            {
                "id": 10,
                "title": "FPGA Emulation of Analog Circuits for Pre-Silicon Verification",
                "summary": "The design cycle of analog and mixed signal (AMS) circuits requires the designer to iteratively perform analog simulations, layout, fabrication, and hardware testing.",
                "prerequisites": "Good knowledge of Signals and Networks, Signal Processing Techniques and Numerical Methods, Exposure to SPICE Simulation, Verilog. The student is expected to be in the Institute campus in his/her 3rd and 4th semester and work with full focus",
                "interdisciplinary": "N/A"
            },
            {
                "id": 11,
                "title": "Testing of Analog Circuits using Statistical and Machine Learning Techniques",
                "summary": "The traditional method for testing analog circuits, which is still commonly used in the industry today, makes sure that the circuits comply with all the specifications set forth in the data sheet. But a specification-based testing technique suffers from high test costs brought on by prolonged testing on pricey test equipment.",
                "prerequisites": "Hands-on with circuit simulation, Good knowledge of analog circuits/analog electronics, Knowledge of Machine learning algorithms, Good coding skill in MATLAB/Python. The student is expected to be in the Institute campus in his/her 3rd and 4th semester and work with full focus",
                "interdisciplinary": "N/A"
            },
            {
                "id": 12,
                "title": "Machine Learning Algorithms for Automatic Test Pattern Generation in Digital VLSI Circuits",
                "summary": "The generation of binary test patterns for VLSI circuits belongs to the class of NP complete problems. As the complexity of VLSI circuits increases, the time to generate test vectors becomes computationally expensive.",
                "prerequisites": "Sound knowledge of Digital VLSI Testing, Any prior knowledge of Machine Learning algorithms, Good coding skill in C/C++/Python. The student must be versatile with Linux OS and Linux commands. The student is expected to be in the Institute campus in his/her 3rd and 4th semester and work with full focus",
                "interdisciplinary": "N/A"
            },
            {
                "id": 13,
                "title": "Analog, Digital, and Mixed-Signal VLSI Design for Edge and Emerging Applications",
                "summary": "This project area focuses on the design, simulation, and implementation of analog, digital, and mixed-signal integrated circuits for neuromorphic computing and other emerging applications.",
                "prerequisites": "Basic Analog and Digital Electronics, CMOS VLSI Design, Electronic Devices, Verilog/SystemVerilog, Cadence Virtuoso and/or Xilinx Vivado/ModelSim, MATLAB/Python",
                "interdisciplinary": "N/A"
            },
            {
                "id": 14,
                "title": "ASIC/FPGA-Based VLSI Design for Neuromorphic and High-Performance Computing Applications",
                "summary": "This project area focuses on the design and implementation of hardware architectures using ASIC and FPGA platforms for neuromorphic and high-performance computing applications.",
                "prerequisites": "Basic Analog and Digital Electronics, CMOS VLSI Design, Electronic Devices, Verilog/SystemVerilog, Cadence Virtuoso and/or Xilinx Vivado/ModelSim, MATLAB/Python",
                "interdisciplinary": "N/A"
            },
            {
                "id": 15,
                "title": "Low-Power and Energy-Efficient VLSI Design for Emerging Computing Systems",
                "summary": "This project area focuses on the development of low-power and energy-efficient VLSI circuits and architectures for emerging computing systems.",
                "prerequisites": "Basic Analog and Digital Electronics, CMOS VLSI Design, Electronic Devices, Verilog/SystemVerilog, Cadence Virtuoso and/or Xilinx Vivado/ModelSim, MATLAB/Python",
                "interdisciplinary": "N/A"
            },
            {
                "id": 16,
                "title": "Design and modelling of flexible capacitive pressure sensor for wearable electronics",
                "summary": "The project proposes the designing of flexible capacitive pressure sensor consisting of two electrodes separated by a microstructured dielectric layer and simulation using finite element modelling.",
                "prerequisites": "No",
                "interdisciplinary": "No"
            },
            {
                "id": 17,
                "title": "Low voltage driven Memristors for Neuromorphic computing",
                "summary": "This project is based on designing, modelling and simulation of memristor devices using 2D materials for neuromorphic computing applications.",
                "prerequisites": "No",
                "interdisciplinary": "No"
            },
            {
                "id": 18,
                "title": "Modelling of Battery Thermal Management System for Electric Vehicles",
                "summary": "This project is based on designing, physical modelling and simulation hybrid battery thermal management system (BTMS) with both active and passive cooling for preventing thermal runaway propagation in the battery module.",
                "prerequisites": "No",
                "interdisciplinary": "No"
            },
            {
                "id": 19,
                "title": "Signal Integrity analysis of on-chip interconnects",
                "summary": "Incessant upgradation in very large scale integration (VLSI) technology has paved way for the development of highly dense integrated circuits that embed billions of transistors and interconnections.",
                "prerequisites": "N/A",
                "interdisciplinary": "N/A"
            },
            {
                "id": 20,
                "title": "Design and analysis of FET-based repeaters for high-speed interconnects",
                "summary": "While the device feature size shrinks, the die size of integrated circuits continues to increase. In this scenario, interconnects have become increasingly significant in determining both the speed and the power consumption of the circuits.",
                "prerequisites": "N/A",
                "interdisciplinary": "N/A"
            },
            {
                "id": 21,
                "title": "Performance analysis of non-conventional cryogenic FETs",
                "summary": "Cryogenic CMOS has emerged as a critical technological pathway to sustain and advance Moore’s law in the post-Moore era.",
                "prerequisites": "N/A",
                "interdisciplinary": "N/A"
            }
        ];

        // How many characters to show before cutting off the text
        const MAX_SUMMARY_LENGTH = 120;

        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            let htmlContent = '';

            projects.forEach(project => {
                // Determine if we need a Read More button
                const isLong = project.summary.length > MAX_SUMMARY_LENGTH;
                const shortSummary = isLong ? project.summary.substring(0, MAX_SUMMARY_LENGTH) + "..." : project.summary;
                
                // Escape quotes so they don't break the HTML attributes
                const safeFullSummary = project.summary.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                const safeShortSummary = shortSummary.replace(/'/g, "&#39;").replace(/"/g, "&quot;");

                // Start building the card
                let cardHtml = `
                    <div class="card">
                        <h3 class="project-title">${project.id}. ${project.title}</h3>
                        
                        <div class="section">
                            <h4>Summary</h4>
                            <p class="summary-text" data-full="${safeFullSummary}" data-short="${safeShortSummary}">
                                ${safeShortSummary}
                            </p>
                            ${isLong ? `<button class="read-more-btn" onclick="toggleSummary(this)">Read More</button>` : ''}
                        </div>
                        
                        <div class="section">
                            <h4>Prerequisites</h4>
                            <p>${project.prerequisites}</p>
                        </div>
                `;

                // Only show Interdisciplinary if it's not "No" or "N/A"
                if (project.interdisciplinary && project.interdisciplinary !== "No" && project.interdisciplinary !== "N/A") {
                    cardHtml += `
                        <div class="section">
                            <h4>Interdisciplinary</h4>
                            <p>${project.interdisciplinary}</p>
                        </div>
                    `;
                }

                cardHtml += `</div>`; // Close card
                htmlContent += cardHtml;
            });

            grid.innerHTML = htmlContent;
        }

        // Function to handle the Read More / Read Less click
        function toggleSummary(btn) {
            const summaryPara = btn.previousElementSibling;
            const fullText = summaryPara.getAttribute('data-full');
            const shortText = summaryPara.getAttribute('data-short');

            if (btn.innerText === "Read More") {
                summaryPara.innerText = fullText;
                btn.innerText = "Read Less";
            } else {
                summaryPara.innerText = shortText;
                btn.innerText = "Read More";
            }
        }

        // Run the render function when the page loads
        window.onload = renderProjects;
    </script>
</body>
</html>
